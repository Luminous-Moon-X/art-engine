pluginManagement {
    repositories {
        maven {
            url 'https://maven.aliyun.com/repository/gradle-plugin'
        }
        gradlePluginPortal()
    }
}
// 根项目名称
rootProject.name = 'art-engine'

// 子项目名称
include 'art-ai'
include 'art-core'
include 'art-system'
include 'art-runner'
include 'art-websocket'
include 'art-log'