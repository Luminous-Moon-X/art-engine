spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/aether?serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: root
    hikari:
      # 连接最大生命周期
      max-lifetime: 1800000      # 30分钟
      # 空闲超时应小于 maxLifetime
      idle-timeout: 600000       # 10分钟
      minimum-idle: 5            # 最小空闲连接数
      maximum-pool-size: 100     # 最大连接数
      connection-timeout: 30000  # 获取连接超时时间
      connection-test-query: SELECT 1  # 验证查询
      # 连接存活检查
      keepalive-time: 30000
  data:
    redis:
      host: localhost
      port: 6379
      password: 123456
      database: 0
      timeout: 10s
      lettuce:
        pool:
          enabled: true
          max-active: 100
          max-idle: 20
          min-idle: 5
          max-wait: 3000ms
          time-between-eviction-runs: 10s
        shutdown-timeout: 200ms
    elasticsearch:
      repositories:
        enabled: false

management:
  health:
    elasticsearch:
      enabled: false
# Art平台配置
art:
  auth:
    # token过期时间 单位：分钟
    token-expire-time: 60
    white-list:
      - /auth/login
      - /auth/logout
      - /auth/changePasswordWithTempToken
      - /swagger-ui.html
      - /api-docs/**
      - /swagger-ui/**
      - /ai/chat
    secret-key: c7ee264fd80c4e169f473df493bf67fd
