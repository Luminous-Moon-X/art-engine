server:
  port: 8080
  servlet:
    context-path: /api
spring:
  main:
    # 由于虚拟线程是守护线程，如果所有线程都是虚拟线程，JVM会直接推出，官方建议开启以下属性避免主线程退出JVM
    keep-alive: true
  threads:
    virtual:
      # 开启虚拟线程
      enabled: true
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 10240MB
      max-request-size: 10240MB
  autoconfigure:
    exclude:
      - com.agentsflex.springboot.store.aliyun.AliyunAutoConfiguration
      - com.agentsflex.springboot.store.chroma.ChromaAutoConfiguration
      - com.agentsflex.springboot.store.elasticsearch.ElasticSearchAutoConfiguration
      - com.agentsflex.springboot.store.opensearch.OpenSearchAutoConfiguration
      - com.agentsflex.springboot.store.qcloud.QCloudStoreAutoConfiguration
      - com.agentsflex.springboot.model.chat.deepseek.DeepSeekAutoConfiguration
      - com.agentsflex.springboot.model.chat.ollama.OllamaAutoConfiguration
      - com.agentsflex.springboot.model.chat.openai.OpenAIAutoConfiguration
      - com.agentsflex.springboot.model.chat.qwen.QwenAutoConfiguration
# swagger配置
management:
  health:
    elasticsearch:
      enabled: false

springdoc:
  # 访问路径
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    # OpenApi描述文档路径，默认为 /v3/api-docs
    path: /api-docs
  # 打印控制台日志
  show-actuator: false
# mybatis-flex指定mapper.xml文件位置
mybatis-flex:
  mapper-locations:
    - classpath:/mapper/*.xml
  global-config:
    # 主键生成策略
    key-config:
      before: true
      key-type: generator
      value: snowFlakeId
# Sa-Token配置
sa-token:
  jwt-secret-key: c7ee264fd80c4e169f473df493bf67fd
  is-read-cookie: false
