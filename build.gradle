import org.gradle.jvm.toolchain.internal.DefaultJavaLanguageVersion

import java.util.concurrent.TimeUnit

plugins {
    id 'io.spring.dependency-management' version "${SPRING_DEPENDENCY_MANAGEMENT_VERSION}" apply(false)
    id 'org.springframework.boot' version "${SPRING_BOOT_VERSION}" apply(false)
}

configure(allprojects) { project ->
    group = "${GROUP}"
    version = "${VERSION}"
}

// 依赖版本管理
ext {
    configuration = [
            javaVersion = JavaLanguageVersion.of(21) as DefaultJavaLanguageVersion,
    ]
    libraries = [
            lombokVersion = '1.18.30',
            apacheCommonsVersion = "3.12.0",
            transmittableThreadLocalVersion = "2.14.5",
            jwtVersion = "0.12.3",
            mybatisVersion = "3.0.4",
            mybatisFlexVersion = "1.11.1",
            postgresqlConnectJavaVersion = "42.7.4",
            druidVersion = "1.2.20",
            reflections = "0.10.2",
            fastjson = "2.0.57",
            hutool = "5.8.38",
            hikariCP = "5.1.0",
            saToken = "1.44.0",
            openApi = "2.8.5",
            redisson = "3.24.3",
            caffeineCache = "3.1.8",
            agentsFlex = "2.1.9"
    ]
    lib = [
            "spring-boot-dependencies"           : "org.springframework.boot:spring-boot-dependencies:${SPRING_BOOT_VERSION}",
            "spring-boot-configuration-processor": "org.springframework.boot:spring-boot-configuration-processor:${SPRING_BOOT_VERSION}",
            "lombok"                             : "org.projectlombok:lombok:${lombokVersion}",
            "commons-lang3"                      : "org.apache.commons:commons-lang3:${apacheCommonsVersion}",
            "transmittable-thread-local"         : "com.alibaba:transmittable-thread-local:${transmittableThreadLocalVersion}",
            "jjwt-api"                           : "io.jsonwebtoken:jjwt-api:${jwtVersion}",
            "jjwt-impl"                          : "io.jsonwebtoken:jjwt-impl:${jwtVersion}",
            "jjwt-jackson"                       : "io.jsonwebtoken:jjwt-jackson:${jwtVersion}",
            "mybatis-flex"                       : "com.mybatis-flex:mybatis-flex-spring-boot3-starter:${mybatisFlexVersion}",
            "mybatis-flex-codegen"               : "com.mybatis-flex:mybatis-flex-codegen:${mybatisFlexVersion}",
            "postgresql-connect-java"            : "org.postgresql:postgresql:${postgresqlConnectJavaVersion}",
            "druid"                              : "com.alibaba:druid-spring-boot-3-starter:${druidVersion}",
            "reflections"                        : "org.reflections:reflections:${reflections}",
            "fastjson"                           : "com.alibaba.fastjson2:fastjson2:${fastjson}",
            "hutool"                             : "cn.hutool:hutool-all:${hutool}",
            "mybatis"                            : "org.mybatis:mybatis-spring:${mybatisVersion}",
            "hikari-cp"                          : "com.zaxxer:HikariCP:${hikariCP}",
            "sa-token"                           : "cn.dev33:sa-token-spring-boot3-starter:${saToken}",
            "sa-token-jwt"                       : "cn.dev33:sa-token-jwt:${saToken}",
            "sa-token-redis"                     : "cn.dev33:sa-token-redis-template:${saToken}",
            "open-api"                           : "org.springdoc:springdoc-openapi-starter-webmvc-ui:${openApi}",
            "redisson"                           : "org.redisson:redisson-spring-boot-starter:${redisson}",
            "caffeine"                           : "com.github.ben-manes.caffeine:caffeine:${caffeineCache}",
            "agents-flex"                        : "com.agentsflex:agents-flex-spring-boot-starter:${agentsFlex}"
    ]
}

// 根项目仓库配置
repositories {
    maven {
        allowInsecureProtocol true
        url 'https://maven.aliyun.com/repository/public/'
    }
    mavenCentral()
}

// 子工程通用配置
configure(subprojects) { project ->
    // 子工程通用插件
    apply(['plugin': 'java'])
    apply(['plugin': 'java-library'])
    apply(['plugin': 'maven-publish'])
    apply(['plugin': 'idea'])
    apply(['plugin': 'io.spring.dependency-management'])

    sourceCompatibility = "${javaVersion}"
    targetCompatibility = "${javaVersion}"

    // Maven仓库
    repositories {
        maven {
            allowInsecureProtocol true
            url 'https://maven.aliyun.com/repository/public/'
        }
    }

    // 依赖引用
    dependencies {
        implementation platform(lib['spring-boot-dependencies'])
        annotationProcessor "${lib.'spring-boot-configuration-processor'}"
        annotationProcessor "com.mybatis-flex:mybatis-flex-processor:${mybatisFlexVersion}"
        annotationProcessor "${lib.'lombok'}"
        implementation "${lib.'mybatis'}"
        implementation "org.springframework.boot:spring-boot-starter-data-redis"
        testImplementation "org.springframework.boot:spring-boot-starter-test"
        implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
        implementation 'org.apache.commons:commons-pool2'
    }

    test {
        useJUnitPlatform()
    }

    // 配置缓存实时更新
    configurations.configureEach {
        resolutionStrategy {
            cacheChangingModulesFor 0, TimeUnit.SECONDS
            cacheDynamicVersionsFor 0, TimeUnit.SECONDS
        }
    }
}
